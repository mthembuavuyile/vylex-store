name: Keep Supabase Alive

on:
  schedule:
    # Runs every 3 days at 06:00 UTC
    - cron: '0 6 */3 * *'
  workflow_dispatch: # Allows manual trigger anytime from GitHub Actions tab

jobs:
  ping-supabase:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase Database via REST API
        env:
          SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "::error::Missing SUPABASE_URL or SUPABASE_ANON_KEY in GitHub Repository Secrets!"
            exit 1
          fi
          
          echo "Sending query request to Supabase to keep project active..."
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" -X GET "${SUPABASE_URL}/rest/v1/products?select=id&limit=1" \
            -H "apikey: ${SUPABASE_ANON_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_ANON_KEY}")

          echo "Response HTTP Status: $HTTP_STATUS"

          if [ "$HTTP_STATUS" -ge 200 ] && [ "$HTTP_STATUS" -lt 300 ]; then
            echo "Success: Supabase project is active and responded successfully!"
          else
            echo "::warning::Received status code $HTTP_STATUS. Please verify your Supabase URL, key, or table name."
          fi
